name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  TF_VERSION: '1.7.5'

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [vpc, eks-baseline, security-baseline, iam-baseline, logging]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: '${{ env.TF_VERSION }}' }
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Init
        working-directory: modules/${{ matrix.module }}
        run: terraform init -backend=false
      - name: Validate
        working-directory: modules/${{ matrix.module }}
        run: terraform validate

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
      - name: Init
        run: tflint --init
      - name: Run
        run: tflint --recursive --format compact

  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@master
        with:
          directory: modules/
          framework: terraform
          quiet: true
          soft_fail: false
          skip_check: CKV_AWS_18  # access logging bucket (auto-recursivo)

  tfsec:
    name: tfsec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/tfsec-action@v1.0.3

  examples-validate:
    name: Validate examples
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [minimal, full]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: '${{ env.TF_VERSION }}' }
      - name: Init
        working-directory: examples/${{ matrix.example }}
        run: terraform init -backend=false
      - name: Validate
        working-directory: examples/${{ matrix.example }}
        run: terraform validate
