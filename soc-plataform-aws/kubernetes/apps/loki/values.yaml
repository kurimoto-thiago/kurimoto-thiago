# Loki distributed values
# Install: helm install loki grafana/loki -n monitoring -f values.yaml

loki:
  auth_enabled: false
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index: { prefix: loki_index_, period: 24h }
  storage:
    type: s3
    s3:
      region: sa-east-1
      bucketnames: soc-platform-loki
  limits_config:
    retention_period: 30d
    max_query_lookback: 30d
    ingestion_rate_mb: 10
    ingestion_burst_size_mb: 20

write:
  replicas: 2
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: 1000m, memory: 1Gi }

read:
  replicas: 2

backend:
  replicas: 2

gateway:
  enabled: true
  replicas: 2

monitoring:
  serviceMonitor: { enabled: true }
  rules: { enabled: true }

# Promtail companion
promtail:
  enabled: true
  config:
    clients:
      - url: http://loki-gateway/loki/api/v1/push
