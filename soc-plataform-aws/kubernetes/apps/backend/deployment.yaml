apiVersion: apps/v1
kind: Deployment
metadata:
  name: soc-backend
  namespace: soc-platform
  labels:
    app: soc-backend
    component: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: soc-backend
  template:
    metadata:
      labels:
        app: soc-backend
        component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: soc-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: REGISTRY/soc-platform-backend:GIT_SHA
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: DB_HOST
              valueFrom: { secretKeyRef: { name: db-credentials, key: host } }
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: db-credentials, key: database } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: db-credentials, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: db-credentials, key: password } }
            - name: DB_SSL
              value: "true"
            - name: REDIS_HOST
              valueFrom: { secretKeyRef: { name: redis-credentials, key: host } }
            - name: REDIS_TLS
              value: "true"
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: jwt-secret, key: secret } }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits:   { cpu: 1000m, memory: 512Mi }
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: soc-backend }
---
apiVersion: v1
kind: Service
metadata:
  name: soc-backend
  namespace: soc-platform
spec:
  type: ClusterIP
  selector: { app: soc-backend }
  ports:
    - port: 3000
      targetPort: http
      name: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: soc-backend
  namespace: soc-platform
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/soc-backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: soc-backend
  namespace: soc-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: soc-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu,    target: { type: Utilization, averageUtilization: 70 } }
    - type: Resource
      resource: { name: memory, target: { type: Utilization, averageUtilization: 80 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: soc-backend
  namespace: soc-platform
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: soc-backend }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: soc-backend
  namespace: soc-platform
spec:
  podSelector:
    matchLabels: { app: soc-backend }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: soc-frontend } }
        - namespaceSelector: { matchLabels: { name: monitoring } }
      ports:
        - { protocol: TCP, port: 3000 }
  egress:
    - to: [] # allow DNS + DB/Redis (refine in prod)
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 6379 }
        - { protocol: UDP, port: 53 }
