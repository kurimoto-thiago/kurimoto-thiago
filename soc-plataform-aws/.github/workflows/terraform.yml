name: Terraform

on:
  push:
    branches: [main]
    paths: ['terraform/**']
  pull_request:
    branches: [main]
    paths: ['terraform/**']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        type: choice
        options: [dev, staging, prod]
      action:
        description: 'plan or apply'
        required: true
        type: choice
        options: [plan, apply]

env:
  AWS_REGION: sa-east-1
  TF_VERSION: '1.7.5'

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || 'plan' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    defaults:
      run: { working-directory: terraform }
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: '${{ env.TF_VERSION }}' }

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init

      - name: Validate
        run: terraform validate

      - name: Plan
        if: github.event_name == 'pull_request' || github.event.inputs.action == 'plan'
        run: |
          ENV=${{ github.event.inputs.environment || 'dev' }}
          terraform plan -var-file="environments/${ENV}.tfvars" -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Apply
        if: github.event.inputs.action == 'apply' && github.ref == 'refs/heads/main'
        run: |
          ENV=${{ github.event.inputs.environment }}
          terraform apply -auto-approve -var-file="environments/${ENV}.tfvars"
