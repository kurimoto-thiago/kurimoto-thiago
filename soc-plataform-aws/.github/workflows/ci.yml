name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  AWS_REGION: sa-east-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

jobs:
  # ============================================================
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.component }}/package-lock.json

      - name: Install
        working-directory: ${{ matrix.component }}
        run: npm ci

      - name: Lint
        working-directory: ${{ matrix.component }}
        run: npm run lint

      - name: Test
        working-directory: ${{ matrix.component }}
        run: npm test

  # ============================================================
  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: '1.7.5' }
      - name: Format check
        working-directory: terraform
        run: terraform fmt -check -recursive
      - name: Init backend=false
        working-directory: terraform
        run: terraform init -backend=false
      - name: Validate
        working-directory: terraform
        run: terraform validate

  # ============================================================
  security-scan:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Checkov IaC scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          quiet: true
          soft_fail: false

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Hadolint Dockerfile scan
        uses: hadolint/hadolint-action@v3
        with:
          dockerfile: backend/Dockerfile

  # ============================================================
  build-and-push:
    name: Build & Push images
    needs: [lint-and-test, security-scan]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.component }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.ECR_REGISTRY }}/soc-platform-${{ matrix.component }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/soc-platform-${{ matrix.component }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/soc-platform-${{ matrix.component }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Cosign sign image
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign sign --yes ${{ env.ECR_REGISTRY }}/soc-platform-${{ matrix.component }}:${{ github.sha }}

  # ============================================================
  update-manifests:
    name: Update GitOps manifests
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GH_PAT }}

      - name: Update image tag
        run: |
          sed -i "s|GIT_SHA|${{ github.sha }}|g" kubernetes/apps/backend/deployment.yaml
          sed -i "s|GIT_SHA|${{ github.sha }}|g" kubernetes/apps/frontend/deployment.yaml

      - name: Commit & push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "chore: update images to ${{ github.sha }}" || exit 0
          git push
