name: ✨ Feature Request
description: Sugerir nova funcionalidade
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual problema isso resolve?
    validations: { required: true }
  - type: textarea
    id: solution
    attributes:
      label: Solução proposta
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
