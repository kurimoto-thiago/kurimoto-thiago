name: 🐛 Bug Report
description: Reportar um bug
labels: [bug, triage]
body:
  - type: textarea
    id: description
    attributes:
      label: Descrição
      description: O que aconteceu?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
  - type: textarea
    id: env
    attributes:
      label: Ambiente
      placeholder: |
        - Versão: vX.Y.Z
        - SO:
        - kubectl version:
        - terraform version:
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: shell
